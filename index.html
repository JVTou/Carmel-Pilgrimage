<style>
  :root{
    --maroon:#6d1f2a; --maroon-dark:#3f1015; --gold:#a9812f; --gold-soft:#c9a862;
    --cream:#f7f2e7; --parchment:#efe6d3; --ink:#2b241d; --ink-soft:#5a4f42;
    font-size:18px;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth; scroll-padding-top:env(safe-area-inset-top,0px);}
  body{
    margin:0; background:var(--cream); color:var(--ink);
    font-family:"EB Garamond", Georgia, serif; line-height:1.65;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{font-family:"Cormorant Garamond", Georgia, serif; font-weight:600; color:var(--maroon-dark); letter-spacing:.01em;}
  a{color:var(--maroon);}
  .wrap{max-width:760px; margin:0 auto; padding:0 28px;}
  .rule{width:64px; height:2px; background:var(--gold); margin:22px auto;}
  .rule.left{margin:22px 0;}

  /* top bar */
  header.top{
    position:sticky; top:0; z-index:20; background:var(--maroon-dark);
    padding:env(safe-area-inset-top,0px) 0 0 0; color:var(--cream);
  }
  .top-inner{max-width:900px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; padding:14px 24px;}
  .wordmark{display:inline-flex; align-items:center; gap:10px;font-family:"Cormorant Garamond",serif; font-size:1.05rem; letter-spacing:.06em; color:var(--gold-soft); text-decoration:none;}
  .top-inner a.cta{color:var(--cream); text-decoration:none; border:1px solid var(--gold-soft); padding:7px 16px; font-size:.85rem; letter-spacing:.03em; border-radius:2px;}
  .top-inner a.cta:hover{background:var(--gold-soft); color:var(--maroon-dark);}

  /* hero */
  .hero{position:relative; min-height:82vh; display:flex; align-items:flex-end; background:var(--cream); overflow:hidden;}
  .hero img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:center 30%; mix-blend-mode:multiply;}
  .hero::after{content:"";position:absolute; inset:0; background:linear-gradient(180deg, rgba(247,242,231,0) 0%, rgba(247,242,231,.35) 45%, rgba(247,242,231,.96) 100%);}
  .hero-content{position:relative; z-index:2; color:var(--ink); padding:48px 28px 56px; max-width:820px; margin:0 auto; text-align:center;}
  .hero-eyebrow{font-family:"EB Garamond",serif; font-style:italic; color:var(--maroon); font-size:1.05rem; margin:0 0 10px;}
  .hero h1{font-size:clamp(2.4rem,6vw,4rem); line-height:1.08; margin:0 0 18px; color:var(--maroon-dark);}
  .hero p.sub{font-size:1.15rem; color:var(--ink); max-width:560px; margin:0 auto 26px;}
  .btn{display:inline-block; background:var(--maroon); color:var(--cream); text-decoration:none; padding:13px 30px; font-family:"EB Garamond",serif; font-size:1rem; letter-spacing:.02em; border-radius:2px; transition:background .2s;}
  .btn:hover{background:var(--maroon-dark);}
  .btn.outline{background:transparent; border:1px solid var(--gold-soft); color:var(--cream);}
  .btn.outline:hover{background:rgba(255,255,255,.08);}

  /* intro */
  section{padding:64px 0;}
  section.alt{background:var(--parchment);}
  .intro p.lead::first-letter{
    font-family:"Cormorant Garamond",serif; font-size:3.6rem; font-weight:600; color:var(--maroon);
    float:left; line-height:.8; padding:8px 10px 0 0;
  }
  .intro h2{font-size:2rem; text-align:center; margin-bottom:6px;}
  .kicker{text-align:center; font-style:italic; color:var(--ink-soft); font-size:1.05rem; margin-top:0;}
  p{margin:0 0 1.1em;}

  /* pull quote */
  .quoteband{background:var(--maroon); color:var(--cream); text-align:center; padding:70px 0;}
  .quoteband blockquote{font-family:"Cormorant Garamond",serif; font-style:italic; font-size:clamp(1.5rem,3.4vw,2.1rem); font-weight:400; max-width:680px; margin:0 auto; line-height:1.4; color:#f4ead2;}
  .quoteband cite{display:block; margin-top:20px; font-family:"EB Garamond",serif; font-style:normal; font-size:.95rem; color:var(--gold-soft); letter-spacing:.03em;}

  /* the way / itinerary */
  .way h2{text-align:center;}
  .steps{max-width:620px; margin:36px auto 0; border-left:2px solid var(--gold-soft); padding-left:0;}
  .step{position:relative; padding:0 0 34px 34px;}
  .step:last-child{padding-bottom:0;}
  .step::before{content:""; position:absolute; left:-7px; top:4px; width:12px; height:12px; border-radius:50%; background:var(--cream); border:2px solid var(--maroon);}
  .step .time{font-family:"Cormorant Garamond",serif; color:var(--maroon); font-size:1.15rem; font-weight:600; display:block; margin-bottom:2px;}
  .step p{margin:0; color:var(--ink-soft); font-size:.98rem;}

  /* testimonials */
  .testimonials{display:grid; grid-template-columns: 1fr 1fr; gap:44px; align-items:center;}
  .testimonials figure{margin:0;}
  .testimonials img{width:100%; display:block; mix-blend-mode:multiply;}
  .testimonials figcaption{font-size:.85rem; color:var(--ink-soft); font-style:italic; text-align:center; margin-top:10px;}
  .test-list blockquote{font-family:"Cormorant Garamond",serif; font-style:italic; font-size:1.3rem; margin:0 0 22px; padding-left:18px; border-left:3px solid var(--gold); color:var(--maroon-dark);}
  .test-list cite{display:block; font-family:"EB Garamond",serif; font-style:normal; font-size:.88rem; color:var(--ink-soft); margin-top:6px;}
  @media (max-width:720px){ .testimonials{grid-template-columns:1fr;} }

  /* video */
  .video-section{text-align:center;}
  .video-section h2{margin-bottom:8px;}
  .video-wrap{position:relative; width:100%; max-width:720px; margin:30px auto 0; aspect-ratio:16/9; box-shadow:0 0 0 1px rgba(0,0,0,.06);}
  .video-wrap iframe{position:absolute; inset:0; width:100%; height:100%; border:0;}
  .video-note{max-width:560px; margin:26px auto 0; color:var(--ink-soft); font-size:.98rem;}

  /* join / cta */
  .join{text-align:center;}
  .join .details{display:flex; justify-content:center; gap:48px; flex-wrap:wrap; margin:34px 0 38px; text-align:left;}
  .join .detail dt{font-family:"Cormorant Garamond",serif; color:var(--maroon); font-size:1.05rem; font-weight:600;}
  .join .detail dd{margin:2px 0 0; color:var(--ink-soft); font-size:.95rem;}

  footer{background:var(--maroon-dark); color:#cbb98f; text-align:center; padding:40px 24px 48px; font-size:.85rem;}
  footer .cross{font-size:1.3rem; color:var(--gold-soft); margin-bottom:10px;}
  footer a{color:#e8dcc8;}

  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ } }
</style>
</head>
